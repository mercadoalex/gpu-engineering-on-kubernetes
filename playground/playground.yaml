kind: playground
name: gpu-engineering-on-kubernetes-62a4150c
base: flexbox
title: GPU Engineering on Kubernetes
description: |-
    Ubuntu 24.04 + kwokctl (binary runtime) + kubectl + helm + jq pre-installed.
    Tier 1 local simulation environment — no real GPU, no kind, no Docker.
    Modules 1–5: GPU fundamentals, scheduling, Kueue, Volcano, observability.
categories:
    - kubernetes
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: dev-machine
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - mount: /
              # Pin to an immutable build tag (NOT :latest) so iximiuz pulls this
              # exact image and never serves a cached older :latest. Bump this tag
              # on every rebuild: make build prints the git-sha tag.
              # Image: kwokctl binary-runtime cache pre-warmed, repo at /workdir.
              source: oci://ghcr.io/mercadoalex/gpu-k8s-lab:7715c97
          network:
            interfaces:
                - network: local
          resources:
            # kind + KWOK control plane + ghostgpu DaemonSet peaks at ~2 GB RAM.
            # 4 GB gives comfortable headroom for Kueue + Volcano in later modules.
            cpuCount: 2
            ramSize: 4Gi
    tabs:
        - id: terminal-dev-machine
          kind: terminal
          name: Terminal
          machine: dev-machine
        - id: ide-dev-machine
          kind: ide
          name: IDE
          machine: dev-machine
        # Grafana (:3000) and Prometheus (:9090) tabs are added in Module 5
        # (GPU Observability). They are omitted here so Modules 1-4 don't show
        # dead tabs with connection errors before those services exist.
    initTasks:
        init_kwok_cluster:
            init: true
            machine: dev-machine
            user: laborant
            timeout_seconds: 300
            run: |
                # The KWOK cluster is created and kept alive by the kwok-cluster.service
                # systemd unit baked into the image. This init task only WAITS for it to
                # be ready and makes the kubeconfig discoverable to later shells + the examiner.
                export KUBECONFIG=/home/laborant/.kube/config
                grep -q 'KUBECONFIG=' "$HOME/.bashrc" 2>/dev/null || \
                  echo 'export KUBECONFIG=/home/laborant/.kube/config' >> "$HOME/.bashrc"
                echo "Waiting for the systemd-managed KWOK cluster..."
                for i in $(seq 1 60); do
                  READY=$(kubectl get nodes --no-headers 2>/dev/null | grep ' Ready ' | wc -l | tr -d ' ')
                  if [ "${READY:-0}" -ge 3 ]; then
                    echo "KWOK cluster ready — ${READY} nodes Ready"
                    kubectl get nodes
                    exit 0
                  fi
                  echo "Waiting for 3 Ready nodes (have ${READY:-0})..."
                  sleep 5
                done
                echo "ERROR: cluster did not reach 3 Ready nodes within timeout" >&2
                exit 1
    accessControl:
        canList:
            - owner
        canRead:
            - anyone
        canStart:
            - anyone
