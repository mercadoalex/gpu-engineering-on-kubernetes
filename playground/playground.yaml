kind: playground
name: gpu-engineering-on-kubernetes-62a4150c
base: flexbox
title: GPU Engineering on Kubernetes
description: |-
    Ubuntu 24.04 + kwokctl (binary runtime) + kubectl + helm + jq pre-installed.
    Tier 1 local simulation environment — no real GPU, no kind, no Docker.
    Modules 1–5: GPU fundamentals, scheduling, Kueue, Volcano, observability.
categories:
    - kubernetes
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: dev-machine
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - mount: /
              # Pin to an immutable build tag (NOT :latest) so iximiuz pulls this
              # exact image and never serves a cached older :latest. Bump this tag
              # on every rebuild: make build prints the git-sha tag.
              # Image: kwokctl binary-runtime cache pre-warmed, repo at /workdir.
              source: oci://ghcr.io/mercadoalex/gpu-k8s-lab:7715c97
          network:
            interfaces:
                - network: local
          resources:
            # kind + KWOK control plane + ghostgpu DaemonSet peaks at ~2 GB RAM.
            # 4 GB gives comfortable headroom for Kueue + Volcano in later modules.
            cpuCount: 2
            ramSize: 4Gi
    tabs:
        - id: terminal-dev-machine
          kind: terminal
          name: Terminal
          machine: dev-machine
        - id: ide-dev-machine
          kind: ide
          name: IDE
          machine: dev-machine
        # Grafana (:3000) and Prometheus (:9090) tabs are added in Module 5
        # (GPU Observability). They are omitted here so Modules 1-4 don't show
        # dead tabs with connection errors before those services exist.
    #
    # NO initTasks: on purpose. The KWOK cluster is created and kept alive by the
    # kwok-cluster.service systemd unit baked into the image, which runs on boot
    # and brings up 3 Ready nodes in ~15-30s. We deliberately do NOT use an iximiuz
    # init task:
    #   - This is a single-machine custom-image playground. The platform injects
    #     `controlPlaneOnly: true` onto init tasks here and they never dispatch
    #     (status stuck at "created"), hanging the "Warming up" screen forever.
    #     Confirmed Oct 2026 vs. the working multi-machine k8s-omni/rancher-k3s
    #     playgrounds, whose init tasks carry NO controlPlaneOnly flag.
    #   - With no init task there is no "Warming up" gate: the student lands
    #     straight in the terminal, and the cluster finishes coming up moments
    #     later. The lesson's first grading task waits for the nodes to be Ready.
    # If iximiuz support later clarifies controlPlaneOnly, an init task can be
    # reintroduced here (see course-1/scripts/init-task-tier1.yaml for the shape).
    accessControl:
        canList:
            - owner
        canRead:
            - anyone
        canStart:
            - anyone
