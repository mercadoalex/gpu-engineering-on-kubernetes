kind: playground
name: gpu-engineering-on-kubernetes-62a4150c
base: flexbox
title: GPU Engineering on Kubernetes
description: |-
    Ubuntu 24.04 + kind + KWOK + kubectl + helm + jq pre-installed.
    Tier 1 local simulation environment — no real GPU required.
    Modules 1–5: GPU fundamentals, scheduling, Kueue, Volcano, observability.
categories:
    - kubernetes
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: dev-machine
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - mount: /
              # TODO: build and push this image before creating the playground.
              # See rootfs/Dockerfile for build instructions.
              # Required tools in image: kind, kwokctl, kubectl, helm, jq, yq, curl, git, bash
              # Required K8s version: 1.31+ (DRA feature gate for ResourceSlices)
              source: oci://ghcr.io/mercadoalex/gpu-k8s-lab:latest  # built: 35bfe27
          network:
            interfaces:
                - network: local
          resources:
            # kind + KWOK control plane + ghostgpu DaemonSet peaks at ~2 GB RAM.
            # 4 GB gives comfortable headroom for Kueue + Volcano in later modules.
            cpuCount: 2
            ramSize: 4Gi
    tabs:
        - id: terminal-dev-machine
          kind: terminal
          name: Terminal
          machine: dev-machine
        - id: ide-dev-machine
          kind: ide
          name: IDE
          machine: dev-machine
        - id: http-grafana
          kind: http-port
          name: Grafana
          machine: dev-machine
          number: 3000
        - id: http-prometheus
          kind: http-port
          name: Prometheus
          machine: dev-machine
          number: 9090
    accessControl:
        canList:
            - owner
        canRead:
            - anyone
        canStart:
            - anyone
