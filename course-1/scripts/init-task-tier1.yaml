# init-task-tier1.yaml
# Reference copy of the KWOK init task for Tier 1 (Course 1, Modules 1-5).
#
# WHERE THIS BELONGS: the PLAYGROUND manifest (playground/playground.yaml),
# under the top-level `playground.initTasks:` key — a SIBLING of `machines:`
# and `tabs:`. It must NOT be placed in a lesson's `index.md` `tasks:` block.
# An `init: true` task in a lesson `tasks:` block makes the "Warming up
# playground... Init tasks completed: 0/N" spinner hang forever. Lesson
# `tasks:` are grading tasks only (no `init:`, no `timeout_seconds:`).
# See .kiro/steering/iximiuz-init-tasks.md (THE #1 RULE).
#
# The KWOK cluster is NOT created by this init task. It is created and kept
# alive by the `kwok-cluster.service` systemd unit baked into the image (see
# rootfs/kwok-cluster.service + rootfs/Dockerfile). The iximiuz examiner reaps
# an init task's ENTIRE process tree when the task completes, so a cluster
# created here would be killed the moment the spinner clears. systemd (PID 1)
# owns the cluster for the VM lifetime; this init task's ONLY job is to WAIT
# for that systemd-managed cluster to report 3 Ready nodes.
#
# This file is documentation only. The authoritative definition lives in
# playground/playground.yaml under playground.initTasks.
initTasks:
  init_kwok_cluster:
    init: true
    machine: dev-machine
    user: laborant
    timeout_seconds: 300
    run: |
      # The KWOK cluster is created and kept alive by the kwok-cluster.service
      # systemd unit baked into the image. This init task only WAITS for it to
      # be ready and makes the kubeconfig discoverable to later shells + the examiner.
      export KUBECONFIG=/home/laborant/.kube/config
      grep -q 'KUBECONFIG=' "$HOME/.bashrc" 2>/dev/null || \
        echo 'export KUBECONFIG=/home/laborant/.kube/config' >> "$HOME/.bashrc"
      echo "Waiting for the systemd-managed KWOK cluster..."
      for i in $(seq 1 60); do
        READY=$(kubectl get nodes --no-headers 2>/dev/null | grep ' Ready ' | wc -l | tr -d ' ')
        if [ "${READY:-0}" -ge 3 ]; then
          echo "KWOK cluster ready — ${READY} nodes Ready"
          kubectl get nodes
          exit 0
        fi
        echo "Waiting for 3 Ready nodes (have ${READY:-0})..."
        sleep 5
      done
      echo "ERROR: cluster did not reach 3 Ready nodes within timeout" >&2
      exit 1
