# init-task-tier1.yaml
# Shared KWOK init task for all Tier 1 lessons (Course 1, Modules 1-5).
# Embed the `init_kwok_cluster:` entry below as the FIRST task in each
# Tier 1 lesson's `tasks:` block in index.md. Do NOT add it to Tier 2
# lessons (Modules 6-8). Keep it byte-identical across lessons.
#
# The course repo is baked into the image at /opt/gpu-k8s-lab (/workdir -> it)
# and the kwokctl binary-runtime cache is warmed at build time, so this task
# does NO repo cloning and fetches NOTHING — it only builds the cluster locally
# and waits for it to be Ready.
tasks:
  init_kwok_cluster:
    init: true
    machine: dev-machine
    user: laborant
    timeout_seconds: 300
    run: |
      set -e
      cd /workdir
      bash course-1/scripts/setup-kwok-cluster.sh
      # Best-effort: wait for the apiserver port (derived from the kubeconfig
      # server URL) before polling node readiness. The script already created
      # the cluster synchronously, so this just hardens against a race.
      PORT=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null | sed -E 's#.*:([0-9]+)/?$#\1#')
      if [ -n "${PORT}" ]; then
        until nc -z 127.0.0.1 "${PORT}" 2>/dev/null; do sleep 2; done
      fi
      kubectl wait --for=condition=Ready nodes --all --timeout=120s
      echo "KWOK cluster ready ✓"
