# init-task-tier1.yaml
# Shared KWOK init task for all Tier 1 lessons (Course 1, Modules 1-5).
# Embed the `init_kwok_cluster:` entry below as the FIRST task in each
# Tier 1 lesson's `tasks:` block in index.md. Do NOT add it to Tier 2
# lessons (Modules 6-8). Keep it byte-identical across lessons.
#
# The KWOK cluster is NOT created by this init task. It is created and kept
# alive by the `kwok-cluster.service` systemd unit baked into the image (see
# rootfs/kwok-cluster.service + rootfs/Dockerfile). The iximiuz examiner reaps
# an init task's ENTIRE process tree when the task completes, so a cluster
# created here would be killed the moment the spinner clears. systemd (PID 1)
# owns the cluster for the VM lifetime; this init task's ONLY job is to WAIT
# for that systemd-managed cluster to report 3 Ready nodes.
tasks:
  init_kwok_cluster:
    init: true
    machine: dev-machine
    user: laborant
    timeout_seconds: 300
    run: |
      set -e
      # The KWOK cluster is created and kept alive by the kwok-cluster.service
      # systemd unit baked into the image (NOT by this init task). The examiner
      # reaps an init task's process tree on completion, so a cluster created
      # here would die. This task only WAITS for the systemd-managed cluster.
      # Wait for the apiserver port derived from the kubeconfig the service wrote.
      echo "Waiting for the systemd-managed KWOK cluster..."
      for i in $(seq 1 60); do
        PORT=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null | sed -E 's#.*:([0-9]+)/?$#\1#')
        if [ -n "${PORT}" ] && nc -z 127.0.0.1 "${PORT}" 2>/dev/null; then
          break
        fi
        sleep 5
      done
      # Loop until 3 nodes report Ready (or the 300s task timeout fires).
      until [ "$(kubectl get nodes --no-headers 2>/dev/null | grep -c ' Ready ')" -ge 3 ]; do
        echo "Waiting for 3 Ready nodes..."
        sleep 5
      done
      echo "KWOK cluster ready ✓"
