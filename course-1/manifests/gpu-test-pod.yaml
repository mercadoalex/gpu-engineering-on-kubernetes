apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: default
  labels:
    app: gpu-test
    course: gpu-engineering-on-kubernetes
    module: "1"
spec:
  containers:
  - name: gpu-test
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        nvidia.com/gpu: "1"
      limits:
        nvidia.com/gpu: "1"
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  restartPolicy: Never
